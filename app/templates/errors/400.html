{% extends "base.html" %}
{% block title %}400 Bad Request - {{ app_title }}{% endblock %}
{% block content %}
<div class="card-custom text-center py-5">
  <div class="card-custom-body">
    <div class="display-1 text-warning fw-bold mb-3">400</div>
    <h3 class="mb-3">Invalid Request Submission</h3>
    <p class="text-secondary mb-4">{{ message or "The server could not process the submitted request due to invalid input parameters." }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-emerald">
      <i class="bi bi-house-door me-1"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
